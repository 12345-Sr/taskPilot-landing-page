<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<meta name="description" content="TaskPilot by Deific Digital (Deific Enterprises) helps you plan, remember and complete your daily tasks. Stay organized, build better habits and achieve your goals — one day at a time.">
<meta property="og:title" content="TaskPilot — Plan Today. Achieve Tomorrow.">
<meta property="og:description" content="Your daily productivity companion. Free to start, no credit card required, works offline.">
<meta property="og:type" content="website">
<title>TaskPilot — Plan Today. Achieve Tomorrow. | Deific Digital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M2 12L22 2L14 22L11 13L2 12Z' fill='%231c7a4e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-900:#0f3d2e;
    --green-800:#155c3f;
    --green-700:#1c7a4e;
    --green-600:#22935c;
    --green-soft:#eaf6ef;
    --yellow:#f6b93b;
    --yellow-dark:#e8a520;
    --cream:#fbfaf6;
    --ink:#152a22;
    --ink-soft:#5b6b63;
    --line:#e7e4da;
    --white:#ffffff;
    --radius:14px;
    --shadow:0 12px 30px rgba(15,61,46,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  section[id]{scroll-margin-top:84px;}
  body{
    font-family:'Poppins', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.5;
    overflow-x:hidden;
    width:1200px;
    margin:0 auto;
  }
  ::selection{background:var(--yellow);color:var(--green-900);}
  .scroll-progress{
    position:fixed;
    top:0;left:0;
    height:3px;
    background:linear-gradient(90deg, var(--green-700), var(--yellow));
    width:0%;
    z-index:999;
    transition:width .1s ease-out;
  }
  a{text-decoration:none;color:inherit;}
  ul{list-style:none;}
  img{max-width:100%;display:block;}
  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:0 32px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:14px 26px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
    border:none;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{
    background:var(--yellow);
    color:var(--green-900);
    box-shadow:0 8px 20px rgba(246,185,59,0.35);
  }
  .btn-primary:hover{background:var(--yellow-dark);}
  .btn-outline{
    background:var(--white);
    color:var(--green-900);
    border:1px solid var(--line);
  }

  /* ===== Header ===== */
  header{
    position:sticky;
    top:0;
    background:rgba(251,250,246,0.92);
    backdrop-filter:blur(6px);
    z-index:100;
    border-bottom:1px solid transparent;
    transition:box-shadow .25s ease, border-color .25s ease, padding .25s ease;
  }
  header.scrolled{
    border-color:var(--line);
    box-shadow:0 6px 24px rgba(15,42,34,0.06);
  }
  header.scrolled .nav{padding:12px 0;}

  /* Mobile nav dropdown */
  .mobile-menu{
    display:none;
    position:absolute;
    top:100%;
    left:0;right:0;
    background:#fff;
    border-bottom:1px solid var(--line);
    box-shadow:0 12px 24px rgba(15,42,34,0.08);
    padding:10px 20px 20px;
  }
  .mobile-menu.open{display:block;}
  .mobile-menu ul{display:flex;flex-direction:column;gap:4px;}
  .mobile-menu a{
    display:block;
    padding:12px 6px;
    font-weight:600;
    border-bottom:1px solid #f2f1eb;
    color:var(--ink);
  }
  .mobile-menu a.active{color:var(--yellow-dark);}
  .mobile-menu .btn{margin-top:14px;width:100%;justify-content:center;}

  /* Scroll reveal */
  .reveal{
    opacity:0;
    transform:translateY(24px);
    transition:opacity .7s cubic-bezier(.22,.61,.36,1), transform .7s cubic-bezier(.22,.61,.36,1);
  }
  .reveal.in-view{opacity:1;transform:translateY(0);}
  .reveal-delay-1{transition-delay:.08s;}
  .reveal-delay-2{transition-delay:.16s;}
  .reveal-delay-3{transition-delay:.24s;}
  .reveal-delay-4{transition-delay:.32s;}
  .reveal-delay-5{transition-delay:.4s;}
  .reveal-delay-6{transition-delay:.48s;}

  /* Back to top */
  .back-to-top{
    position:fixed;
    right:24px;
    bottom:24px;
    width:48px;height:48px;
    border-radius:50%;
    background:var(--green-800);
    color:#fff;
    border:none;
    display:flex;
    align-items:center;justify-content:center;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(15,42,34,0.25);
    opacity:0;
    pointer-events:none;
    transform:translateY(12px);
    transition:opacity .25s ease, transform .25s ease, background .2s ease;
    z-index:90;
  }
  .back-to-top.show{opacity:1;pointer-events:auto;transform:translateY(0);}
  .back-to-top:hover{background:var(--green-700);}
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 0;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:22px;
    font-weight:800;
    color:var(--green-900);
  }
  .logo svg{flex-shrink:0;}
  .logo .pilot{color:var(--yellow-dark);}
  .nav-links{
    display:flex;
    gap:34px;
    font-weight:600;
    font-size:15px;
    color:var(--ink);
  }
  .nav-links a{position:relative;padding-bottom:6px;}
  .nav-links a.active{color:var(--yellow-dark);}
  .nav-links a.active::after{
    content:'';
    position:absolute;
    left:0;right:0;bottom:0;
    height:2px;
    background:var(--yellow-dark);
    border-radius:2px;
  }
  .nav-links a:hover{color:var(--green-700);}
  .burger{display:none;background:none;border:none;font-size:26px;cursor:pointer;color:var(--green-900);}

  /* ===== Hero ===== */
  .hero{
    padding:80px 0 60px;
    position:relative;
    overflow:hidden;
  }
  .hero .wrap{
    display:grid;
    grid-template-columns:1fr 1.15fr;
    gap:40px;
    align-items:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#fdeecb;
    color:#a9720c;
    font-weight:700;
    font-size:13px;
    padding:8px 16px;
    border-radius:999px;
    margin-bottom:24px;
  }
  .hero h1{
    font-size:48px;
    line-height:1.12;
    font-weight:800;
    color:var(--green-900);
    letter-spacing:-0.5px;
  }
  .hero h1 .accent{color:var(--green-700);position:relative;display:inline-block;}
  .hero h1 .accent::after{
    content:'';
    position:absolute;
    left:0;bottom:2px;
    width:100%;
    height:5px;
    background:var(--yellow);
    z-index:-1;
    opacity:.55;
  }
  .hero p.lead{
    margin-top:20px;
    font-size:16.5px;
    color:var(--ink-soft);
    max-width:460px;
  }
  .checks{
    display:flex;
    gap:22px;
    margin-top:22px;
    flex-wrap:wrap;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
  }
  .checks li{display:flex;align-items:center;gap:6px;}
  .checks li .tick{
    width:18px;height:18px;
    background:var(--green-700);
    color:#fff;
    border-radius:50%;
    display:inline-flex;
    align-items:center;justify-content:center;
    font-size:11px;
  }
  .hero-cta{
    margin-top:30px;
    display:flex;
    align-items:center;
    gap:26px;
    flex-wrap:wrap;
  }
  .watch{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    font-size:14px;
  }
  .watch .playbtn{
    width:40px;height:40px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--line);
    display:flex;
    align-items:center;justify-content:center;
    box-shadow:var(--shadow);
    color:var(--green-800);
  }
  .watch .sub{color:var(--ink-soft);font-weight:500;font-size:12.5px;}

  /* Hero visual */
  .hero-visual{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    min-height:440px;
  }
  .hero-blob{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 65% 30%, #fdf3d9 0%, rgba(253,243,217,0) 60%),
                linear-gradient(180deg, var(--green-soft) 0%, #eaf3ea 100%);
    border-radius:36px;
    z-index:0;
  }
  .scene{
    position:relative;
    z-index:2;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:0;
  }
  .tag-note{
    position:absolute;
    top:24px;
    right:6%;
    font-family:'Segoe Script','Brush Script MT',cursive;
    font-size:19px;
    color:var(--green-800);
    line-height:1.3;
    z-index:3;
    transform:rotate(-4deg);
  }

  .phone{
    position:relative;
    z-index:2;
    width:250px;
    background:#152a22;
    border-radius:34px;
    padding:12px;
    box-shadow:0 30px 60px rgba(15,42,34,0.35);
  }
  .phone-screen{
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    padding-bottom:10px;
  }
  .phone-status{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    font-weight:700;
    padding:10px 16px 4px;
    color:var(--ink);
  }
  .phone-topbar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 16px 12px;
    font-weight:800;
    font-size:14px;
    color:var(--green-900);
  }
  .phone-body{padding:0 14px;}
  .greet{font-size:14px;font-weight:700;color:var(--ink);}
  .greet .wave{margin-left:2px;}
  .greet-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;margin-bottom:12px;}
  .progress-card{
    background:var(--green-soft);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:12px;
  }
  .progress-card .row{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--green-900);margin-bottom:6px;}
  .progress-bar{height:6px;background:#d7ead9;border-radius:6px;overflow:hidden;}
  .progress-bar span{display:block;height:100%;width:67%;background:var(--green-700);border-radius:6px;}
  .day-label{font-size:11px;font-weight:700;color:var(--ink-soft);margin:10px 0 8px;}
  .task-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 0;
    border-bottom:1px solid #f0efe9;
    font-size:11.5px;
  }
  .task-item:last-of-type{border-bottom:none;}
  .task-left{display:flex;align-items:center;gap:8px;}
  .task-check{
    width:16px;height:16px;border-radius:50%;
    background:var(--green-700);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;flex-shrink:0;
  }
  .task-name{font-weight:700;color:var(--ink);}
  .task-time{color:var(--ink-soft);font-size:10px;}
  .badge{
    font-size:9px;font-weight:800;
    padding:3px 8px;border-radius:999px;
    white-space:nowrap;
  }
  .badge.medium{background:#fdeecb;color:#a9720c;}
  .badge.high{background:#fde1e1;color:#c23b3b;}
  .badge.normal{background:#dff3e4;color:#1c7a4e;}
  .add-task-btn{
    margin-top:10px;
    background:var(--green-700);
    color:#fff;
    text-align:center;
    padding:9px;
    border-radius:10px;
    font-size:11.5px;
    font-weight:700;
  }
  .phone-nav{
    display:flex;
    justify-content:space-around;
    padding:10px 6px 4px;
    border-top:1px solid #f0efe9;
    margin-top:8px;
  }
  .phone-nav div{
    font-size:9px;
    color:var(--ink-soft);
    text-align:center;
    font-weight:600;
  }
  .phone-nav div span{
    display:block;
    font-size:14px;
    margin-bottom:2px;
  }
  .phone-nav div.active{color:var(--green-700);}

  .person{
    position:absolute;
    right:2%;
    bottom:0;
    width:230px;
    z-index:1;
  }

  /* ===== Why section ===== */
  .why{
    padding:90px 0 60px;
    text-align:center;
  }
  .section-eyebrow{
    color:var(--yellow-dark);
    font-weight:800;
    font-size:13px;
    letter-spacing:0.4px;
    margin-bottom:10px;
  }
  .why h2, .how h2, .impact h2{
    font-size:34px;
    font-weight:800;
    color:var(--green-900);
    margin-bottom:12px;
  }
  .why p.sub{
    color:var(--ink-soft);
    max-width:480px;
    margin:0 auto 50px;
    font-size:15.5px;
  }
  .feature-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:0;
  }
  .feature{
    padding:20px 20px;
    border-right:1px solid var(--line);
    border-radius:16px;
    transition:transform .25s ease, background .25s ease;
    cursor:default;
  }
  .feature:hover{
    transform:translateY(-6px);
    background:#fff;
    box-shadow:var(--shadow);
  }
  .feature:hover .icon{transform:scale(1.1);}
  .feature .icon{transition:transform .25s ease;}
  .feature:last-child{border-right:none;}
  .feature .icon{
    width:56px;height:56px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:22px;
    margin:0 auto 16px;
  }
  .feature:nth-child(1) .icon{background:var(--green-soft);}
  .feature:nth-child(2) .icon{background:#fdeecb;}
  .feature:nth-child(3) .icon{background:var(--green-soft);}
  .feature:nth-child(4) .icon{background:#fdeecb;}
  .feature:nth-child(5) .icon{background:var(--green-soft);}
  .feature:nth-child(6) .icon{background:#fdeecb;}
  .feature h3{
    font-size:15.5px;
    font-weight:800;
    color:var(--green-900);
    margin-bottom:8px;
  }
  .feature p{
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ===== How it works ===== */
  .how{
    background:var(--green-soft);
    border-radius:28px;
    margin:20px 24px 80px;
    padding:70px 50px;
  }
  .how .wrap{
    max-width:1100px;
    display:grid;
    grid-template-columns:0.85fr 1.4fr;
    gap:50px;
    align-items:center;
    padding:0;
  }
  .how .tag{
    display:inline-block;
    background:#fff;
    border:1px solid var(--line);
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    color:var(--green-800);
    margin-bottom:20px;
    letter-spacing:0.3px;
  }
  .how h2{text-align:left;font-size:32px;}
  .how p.desc{
    color:var(--ink-soft);
    font-size:15px;
    margin:16px 0 22px;
  }
  .how-list li{
    display:flex;
    align-items:center;
    gap:10px;
    font-weight:700;
    font-size:14.5px;
    color:var(--ink);
    margin-bottom:12px;
  }
  .how-list .tick{
    width:20px;height:20px;
    background:var(--green-700);
    color:#fff;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
    flex-shrink:0;
  }
  .goal-note{
    margin-top:26px;
    font-family:'Segoe Script','Brush Script MT',cursive;
    color:var(--green-800);
    font-size:17px;
    position:relative;
  }

  .mock-row{
    display:flex;
    gap:20px;
    justify-content:center;
  }
  .mock-card{
    background:#fff;
    border-radius:20px;
    padding:14px;
    width:200px;
    box-shadow:var(--shadow);
    font-size:11px;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .mock-card:hover{
    transform:translateY(-8px) rotate(0deg);
    box-shadow:0 20px 40px rgba(15,61,46,0.15);
  }
  .mock-card .mtop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-weight:800;
    font-size:12px;
    margin-bottom:10px;
    color:var(--green-900);
  }
  .mock-hero-img{
    height:80px;
    border-radius:12px;
    background:linear-gradient(180deg,#cfe9d3,#a9d6b4);
    margin-bottom:12px;
  }
  .mock-card h4{font-size:13px;font-weight:800;color:var(--green-900);margin-bottom:4px;}
  .mock-card .muted{color:var(--ink-soft);font-size:10.5px;margin-bottom:14px;}
  .mock-btn{
    background:var(--yellow);
    color:var(--green-900);
    text-align:center;
    padding:8px;
    border-radius:8px;
    font-weight:800;
    font-size:11px;
    margin-bottom:8px;
  }
  .mock-link{text-align:center;font-size:10px;color:var(--ink-soft);}
  .mock-field{
    background:#f5f4ef;
    border-radius:8px;
    padding:7px 9px;
    margin-bottom:8px;
    color:var(--ink-soft);
    font-size:10px;
  }
  .field-label{font-size:9.5px;color:var(--ink-soft);font-weight:700;margin-bottom:3px;}
  .priority-row{display:flex;gap:6px;margin-bottom:8px;}
  .priority-row span{
    flex:1;text-align:center;
    padding:5px 0;border-radius:6px;
    font-size:9px;font-weight:700;
  }
  .priority-row .high{background:#fde1e1;color:#c23b3b;}
  .priority-row .medium{background:#fdeecb;color:#a9720c;border:1px solid var(--yellow);}
  .priority-row .normal{background:#f5f4ef;color:var(--ink-soft);}
  .mock-save{
    background:var(--green-700);
    color:#fff;
    text-align:center;
    padding:8px;
    border-radius:8px;
    font-weight:800;
    font-size:11px;
    margin-top:4px;
  }
  .ring-wrap{
    display:flex;
    justify-content:center;
    margin:10px 0 14px;
  }
  .ring{
    width:76px;height:76px;
    border-radius:50%;
    background:conic-gradient(var(--green-700) 0% 67%, var(--yellow) 67% 100%);
    display:flex;align-items:center;justify-content:center;
  }
  .ring-inner{
    width:58px;height:58px;
    border-radius:50%;
    background:#fff;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    font-weight:800;
    color:var(--green-900);
    font-size:14px;
  }
  .ring-inner span{font-size:8px;font-weight:600;color:var(--ink-soft);}
  .evening-item{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
    font-size:10.5px;
  }
  .evening-item .dot{
    width:16px;height:16px;border-radius:50%;
    background:var(--green-700);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:8px;flex-shrink:0;
  }
  .evening-item .dot.empty{background:#eee;color:transparent;}
  .evening-item div h5{font-size:10.5px;font-weight:700;color:var(--ink);}
  .evening-item div p{font-size:9px;color:var(--ink-soft);}
  .note-box{
    background:#fdeecb;
    border-radius:8px;
    padding:8px;
    font-size:9.5px;
    font-weight:700;
    color:#a9720c;
    margin:8px 0;
  }

  /* ===== Testimonials ===== */
  .impact{padding:20px 0 80px;}
  .impact-top{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
    align-items:end;
    margin-bottom:44px;
  }
  .impact .tag{
    display:inline-block;
    background:#fdeecb;
    color:#a9720c;
    padding:6px 14px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    margin-bottom:16px;
  }
  .impact h2{text-align:left;font-size:32px;margin-bottom:10px;}
  .impact p{color:var(--ink-soft);font-size:15px;max-width:400px;}
  .stats{
    display:flex;
    gap:36px;
    justify-content:flex-end;
  }
  .stat{text-align:center;}
  .stat .icon{font-size:20px;margin-bottom:6px;}
  .stat .num{font-size:20px;font-weight:800;color:var(--green-900);}
  .stat .label{font-size:11.5px;color:var(--ink-soft);}

  .testimonials{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:24px;
  }
  .t-card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px;
